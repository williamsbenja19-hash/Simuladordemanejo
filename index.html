<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motor 3D Simulador de Manejo Copiloto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay para forzar modo horizontal */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 15, 0.95);
            z-index: 9999;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #orientation-warning svg {
            width: 80px;
            height: 80px;
            fill: #ff3b30;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        /* UI Mínima: Solo botón de micrófono */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #mic-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.85), rgba(200, 20, 20, 0.95));
            border: 3px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 59, 48, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease, background 0.3s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #mic-btn:active {
            transform: scale(0.92);
        }

        #mic-btn.listening {
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.9), rgba(40, 160, 70, 0.95));
            box-shadow: 0 0 30px rgba(52, 199, 89, 0.8);
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        #mic-btn svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        /* HUD Informativo sutil */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #speech-feedback {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #34c759;
            font-size: 14px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(52, 199, 89, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #speech-feedback.visible {
            opacity: 1;
        }

        /* Pantalla de Inicio / Bloqueo para reproducir Audio */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        #start-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #ff3b30;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.5);
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <svg viewBox="0 0 24 24">
            <path d="M17,1.01L7,1C5.9,1 5,1.9 5,3v18c0,1.1 0.9,2 2,2h10c1.1,0 2,-0.9 2,-2V3C19,1.9 18.1,1.01 17,1.01zM17,19H7V5h10V19z"/>
        </svg>
        <h2>GIRA TU DISPOSITIVO</h2>
        <p>Este simulador requiere orientación horizontal para una visión completa de la cabina.</p>
    </div>

    <div id="start-screen">
        <h1>SIMULADOR DE MANEJO 3D</h1>
        <p>Vista interior copiloto - Control por voz</p>
        <button id="start-btn">INICIAR ENGINE</button>
    </div>

    <div id="ui-layer">
        <div id="hud">VELOCIDAD: <span id="speed-val">0</span> KM/H</div>
        <div id="speech-feedback">ÓRDEN: <span id="command-val">-</span></div>
        
        <button id="mic-btn" aria-label="Hablar">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
    </div>

    <div id="canvas-container"></div>

    <!-- Biblioteca 3D Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /* =========================================================================
           CÓDIGO BASE MOTOR 3D - SIMULADOR DE MANEJO
           ========================================================================= */

        let scene, camera, renderer;
        let playerCar, conductora, steeringWheel;
        let trafficVehicles = [];
        let pedestrians = [];
        let buildings = [];
        let cityGrid = [];

        // Físicas y Estado
        let currentSpeed = 0;
        let targetSpeed = 0;
        let maxSpeed = 120;
        let steeringAngle = 0;
        let targetSteeringAngle = 0;
        let currentGear = 'D'; // D, R, P
        let isHeadlightsOn = true;

        // Elementos DOM
        const speedValEl = document.getElementById('speed-val');
        const commandValEl = document.getElementById('command-val');
        const speechFeedbackEl = document.getElementById('speech-feedback');
        const micBtn = document.getElementById('mic-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const orientationWarning = document.getElementById('orientation-warning');

        // Inicializar Renderizador y Escena
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. ESCENA & RENDERER
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c14);
            scene.fog = new THREE.FogExp2(0x0a0c14, 0.012);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // 2. CÁMARA (CONFIGURADA DENTRO DE LA CABINA - ASIENTO COPILOTO)
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
            
            // 3. ILUMINACIÓN AVANZADA
            const ambientLight = new THREE.AmbientLight(0xddeeff, 0.3);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0x88aaff, 0.8);
            moonLight.position.set(100, 150, 50);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            moonLight.shadow.camera.near = 0.5;
            moonLight.shadow.camera.far = 300;
            const d = 100;
            moonLight.shadow.camera.left = -d;
            moonLight.shadow.camera.right = d;
            moonLight.shadow.camera.top = d;
            moonLight.shadow.camera.bottom = -d;
            scene.add(moonLight);

            // 4. CONSTRUCCIÓN DEL MUNDO Y VEHÍCULO
            buildCity();
            buildPlayerCarWithInterior();
            spawnTraffic();
            spawnPedestrians();

            // Eventos
            window.addEventListener('resize', onWindowResize);
            checkOrientation();
            window.addEventListener('orientationchange', checkOrientation);

            // Bucle de renderizado
            animate();
        }

        /* -------------------------------------------------------------------------
           CONSTRUCCIÓN DE LA CIUDAD (Edificios, Calles, Semáforos)
           ------------------------------------------------------------------------- */
        function buildCity() {
            const blockSize = 60;
            const roadWidth = 20;
            const citySize = 6;

            // Materiales de Ciudad
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
            const sidewalkMaterial = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });
            
            // Textura procedural para ventanas de edificios
            const buildingMaterials = [
                new THREE.MeshStandardMaterial({ color: 0x111625, roughness: 0.2, metalness: 0.8 }),
                new THREE.MeshStandardMaterial({ color: 0x1a202c, roughness: 0.3, metalness: 0.5 }),
                new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.9 })
            ];

            // Suelo Base
            const floorGeo = new THREE.PlaneGeometry(1000, 1000);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.1;
            scene.add(floor);

            // Generación de Cuadras y Calles
            for (let i = -citySize; i <= citySize; i++) {
                for (let j = -citySize; j <= citySize; j++) {
                    const x = i * (blockSize + roadWidth);
                    const z = j * (blockSize + roadWidth);

                    // Manzana / Vereda
                    const sidewalkGeo = new THREE.BoxGeometry(blockSize, 0.3, blockSize);
                    const sidewalk = new THREE.Mesh(sidewalkGeo, sidewalkMaterial);
                    sidewalk.position.set(x, 0.15, z);
                    sidewalk.receiveShadow = true;
                    scene.add(sidewalk);

                    // Edificios en la manzana
                    const numBuildings = 4;
                    const subBlock = blockSize / 2;
                    for (let bx = 0; bx < 2; bx++) {
                        for (let bz = 0; bz < 2; bz++) {
                            const h = 20 + Math.random() * 60;
                            const bGeo = new THREE.BoxGeometry(subBlock - 4, h, subBlock - 4);
                            const bMat = buildingMaterials[Math.floor(Math.random() * buildingMaterials.length)];
                            const building = new THREE.Mesh(bGeo, bMat);
                            
                            building.position.set(
                                x - subBlock/2 + bx * subBlock,
                                h / 2 + 0.3,
                                z - subBlock/2 + bz * subBlock
                            );
                            building.castShadow = true;
                            building.receiveShadow = true;
                            scene.add(building);
                            buildings.push(building);
                        }
                    }

                    // Farolas de calle
                    createStreetLamp(x + blockSize/2 + 2, z + blockSize/2 + 2);
                    createStreetLamp(x - blockSize/2 - 2, z - blockSize/2 - 2);
                }
            }
        }

        function createStreetLamp(x, z) {
            const group = new THREE.Group();
            const poleGeo = new THREE.CylinderGeometry(0.1, 0.15, 6);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.y = 3;
            group.add(pole);

            const light = new THREE.PointLight(0xffaa44, 1, 15);
            light.position.set(0, 5.8, 0);
            group.add(light);

            group.position.set(x, 0, z);
            scene.add(group);
        }

        /* -------------------------------------------------------------------------
           CONSTRUCCIÓN DEL VEHÍCULO PRINCIPAL Y CABINA INTERIOR DETALLADA
           ------------------------------------------------------------------------- */
        function buildPlayerCarWithInterior() {
            playerCar = new THREE.Group();

            // 1. Carrocería Externa (Chasis)
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x880000,
                metalness: 0.9,
                roughness: 0.2
            });

            const bodyGeo = new THREE.BoxGeometry(2.1, 1.2, 4.5);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            playerCar.add(body);

            // 2. Techo / Parabrisas (Estructura de la cabina)
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.2,
                roughness: 0.1,
                transmission: 0.9
            });

            const windshieldGeo = new THREE.PlaneGeometry(1.8, 1.0);
            const windshield = new THREE.Mesh(windshieldGeo, glassMat);
            windshield.position.set(0, 1.45, 0.8);
            windshield.rotation.x = -Math.PI / 4;
            playerCar.add(windshield);

            // 3. INTERIOR DE LA CABINA (Tablero, Volante, Asientos)
            const interiorMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });

            // Tablero / Torpedo
            const dashGeo = new THREE.BoxGeometry(1.9, 0.5, 0.7);
            const dashboard = new THREE.Mesh(dashGeo, interiorMat);
            dashboard.position.set(0, 1.1, 0.7);
            playerCar.add(dashboard);

            // Volante (Lado Izquierdo - Conductora)
            const wheelGeo = new THREE.TorusGeometry(0.2, 0.03, 8, 24);
            steeringWheel = new THREE.Mesh(wheelGeo, new THREE.MeshStandardMaterial({ color: 0x050505 }));
            steeringWheel.position.set(-0.45, 1.15, 0.4);
            steeringWheel.rotation.x = Math.PI / 3;
            playerCar.add(steeringWheel);

            // Asientos (Conductor y Copiloto)
            const seatGeo = new THREE.BoxGeometry(0.6, 0.8, 0.6);
            const seatDriver = new THREE.Mesh(seatGeo, interiorMat);
            seatDriver.position.set(-0.45, 0.8, -0.2);
            playerCar.add(seatDriver);

            const seatCopilot = new THREE.Mesh(seatGeo, interiorMat);
            seatCopilot.position.set(0.45, 0.8, -0.2);
            playerCar.add(seatCopilot);

            // 4. PERSONAJE: LA CONDUCTORA (SOFÍA)
            conductora = new THREE.Group();
            
            // Cuerpo / Torso
            const torsoGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.7);
            const torsoMat = new THREE.MeshStandardMaterial({ color: 0x225588 });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 1.0;
            conductora.add(torso);

            // Cabeza
            const headGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.5 });
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.45;
            conductora.add(head);

            // Pelo
            const hairGeo = new THREE.SphereGeometry(0.17, 16, 16);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x331100 });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.set(0, 1.5, -0.02);
            conductora.add(hair);

            conductora.position.set(-0.45, 0.2, -0.2);
            playerCar.add(conductora);

            // 5. Ruedas
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            const wheelPositions = [
                [-1.0, 0.35, 1.4], [1.0, 0.35, 1.4],
                [-1.0, 0.35, -1.4], [1.0, 0.35, -1.4]
            ];

            wheelPositions.forEach(pos => {
                const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
                const w = new THREE.Mesh(wGeo, wheelMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(...pos);
                playerCar.add(w);
            });

            // 6. Luces Delanteras (Headlights)
            const lightL = new THREE.SpotLight(0xffffff, 3, 40, Math.PI / 6, 0.5);
            lightL.position.set(-0.8, 0.8, 2.2);
            lightL.target.position.set(-0.8, 0, 10);
            playerCar.add(lightL);
            playerCar.add(lightL.target);

            const lightR = new THREE.SpotLight(0xffffff, 3, 40, Math.PI / 6, 0.5);
            lightR.position.set(0.8, 0.8, 2.2);
            lightR.target.position.set(0.8, 0, 10);
            playerCar.add(lightR);
            playerCar.add(lightR.target);

            playerCar.position.set(0, 0, 0);
            scene.add(playerCar);

            // 7. POSICIONAR CÁMARA DENTRO DEL ASIENTO COPILOTO
            // X: 0.45 (Derecha), Y: 1.45 (Altura ojos), Z: -0.1 (Asiento)
            camera.position.set(0.45, 1.45, -0.1);
            camera.rotation.set(0, 0, 0);
            playerCar.add(camera); // La cámara se mueva junto con el auto
        }

        /* -------------------------------------------------------------------------
           GENERACIÓN DE TRÁFICO Y PEATONES (IA AMBIENTAL)
           ------------------------------------------------------------------------- */
        function spawnTraffic() {
            const colors = [0x111111, 0xffffff, 0x0033aa, 0x008833, 0xaaaaaa];
            for (let i = 0; i < 15; i++) {
                const carGroup = new THREE.Group();
                const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length] });
                const body = new THRE
